# Blueprint de Render: crea la base PostgreSQL y el servicio web.
# Render > New > Blueprint > elegir este repositorio.
databases:
  - name: vinilo-db
    databaseName: vinilo
    user: vinilo
    plan: free          # cambiar a un plan pago para producción

services:
  - type: web
    name: vinilo-almacen
    runtime: node
    plan: free          # cambiar a un plan pago para que no se "duerma"
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vinilo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false     # Render la pide al crear el Blueprint
      - key: FUDO_API_KEY
        sync: false     # apiKey de Fudo
      - key: FUDO_API_SECRET
        sync: false     # apiSecret de Fudo
      - key: NODE_VERSION
        value: "20"
