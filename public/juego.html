<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8281e">
<title>Pizzaiolo de la Noche · Vinilo</title>
<link rel="icon" href="/favicon.png?v=2" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--rojo:#c8281e;--rojo2:#8e1a13;--basil:#2f8f3c;--paper:#fff;--ink:#20130f;--mut:#7a6760;--line:#eadcd5;--ember:#ff8a1f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--rojo);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100%;background:var(--paper);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,.lil{font-family:"Lilita One",Nunito,sans-serif;font-weight:400}
.cab{background:var(--rojo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px}
.cab img{width:46px;height:46px;border-radius:50%;background:#fff}
.cab b{font:22px/1.05 "Lilita One",sans-serif;display:block}.cab small{opacity:.9;font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line)}
.hud[hidden]{display:none}
.hud b{font:22px "Lilita One";color:var(--rojo)}.hud span{font-size:13px;color:var(--mut);font-weight:700}
.vista{flex:1;display:flex;flex-direction:column;padding:16px 18px 22px;gap:12px}
.vista h2{margin:0;font-size:28px;line-height:1.05}
.vista p{margin:0;color:var(--mut)}
.btn{font:800 17px Nunito;border:0;border-radius:16px;padding:15px 18px;min-height:54px;background:var(--rojo);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--rojo2);transition:transform .08s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rojo2)}
.btn:disabled{opacity:.6}
.btn.verde{background:var(--basil);box-shadow:0 5px 0 #1f6129}
.btn:focus-visible,input:focus-visible,.op:focus-visible,.hole:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
label{font-weight:800}
input.campo{font:700 18px Nunito;padding:14px;border:2px solid var(--line);border-radius:14px;width:100%;color:var(--ink);background:#fff}
.fila{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.mesa{display:inline-flex;gap:8px;align-items:center;background:#fdeceb;color:var(--rojo);font-weight:800;border-radius:99px;padding:6px 12px;font-size:14px;align-self:flex-start}
.rondas{display:grid;gap:8px}
.rondas div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rondas svg{width:42px;height:42px;flex:none}.rondas b{display:block}.rondas small{color:var(--mut)}
.premio{background:var(--basil);color:#fff;border-radius:14px;padding:11px 14px;font-weight:800}
.err{color:var(--rojo);font-weight:800;min-height:22px}
.oven{position:relative;height:min(300px,40vh);border-radius:20px;overflow:hidden;background:#1a0e0a}
.oven svg{position:absolute;inset:0;width:100%;height:100%}
.calor{height:20px;border-radius:99px;background:linear-gradient(90deg,#f3dca8,#e8a849 55%,#2f8f3c 85%,#2f8f3c 97%,#3a1a10 100%);position:relative;overflow:hidden}
.calor i{position:absolute;top:-3px;bottom:-3px;width:5px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px #fff}
.leyenda{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:700}
.msg{min-height:26px;font-weight:800;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hole{aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 50% 60%,#e9d8b4 55%,#d6bf92 56%);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;touch-action:manipulation}
.hole svg{width:74%;height:74%;transform:scale(0);transition:transform .14s}
.hole.on svg{transform:scale(1)}
.hole .pts{position:absolute;font:20px "Lilita One";animation:sube .7s forwards;pointer-events:none}
@keyframes sube{to{transform:translateY(-34px);opacity:0}}
.barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.barra i{display:block;height:100%;background:var(--rojo)}
.ops{display:grid;gap:9px}
.op{font:700 16px Nunito;text-align:left;border:2px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;color:var(--ink);cursor:pointer;min-height:50px}
.op.elegida{border-color:var(--ink)}
.op.ok{border-color:var(--basil);background:#e7f4e9}.op.mal{border-color:var(--rojo);background:#fbe9e7}
.preg{font:22px/1.15 "Lilita One"}
.total{font:76px/1 "Lilita One";color:var(--rojo);text-align:center}
.desg{display:grid}.desg div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:7px 0}
.puesto{text-align:center;font-weight:800;font-size:18px}
.top{display:grid;gap:6px}.top div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#f7f1ee}
.top div.yo{background:var(--rojo);color:#fff}.top .n{font:20px "Lilita One";text-align:center}.top .p{font:20px "Lilita One"}.top small{opacity:.75;margin-left:6px}
.cargando{flex:1;display:grid;place-items:center;color:var(--mut);font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="cab"><img src="/gato.png" alt=""><div><b>Pizzaiolo de la Noche</b><small id="local">Vinilo</small></div></header>
  <div class="hud" id="hud" hidden><span id="hud-r">Ronda 1 de 3</span><b id="hud-p">0</b></div>
  <main class="vista" id="vista"><div class="cargando">Cargando…</div></main>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-tom" viewBox="0 0 60 60"><circle cx="30" cy="34" r="22" fill="#d8301f"/><ellipse cx="22" cy="27" rx="6" ry="4" fill="#ff7a62" opacity=".7"/><path d="M30 13l4 6 7-2-4 6 6 4-8 0-5 6-1-7-8-2 7-4z" fill="#2f8f3c"/></symbol>
  <symbol id="i-moz" viewBox="0 0 60 60"><path d="M10 34c0-12 10-20 21-20s19 8 19 19-9 15-20 15-20-3-20-14z" fill="#fbf7ef" stroke="#e3d6bf" stroke-width="2"/><ellipse cx="24" cy="27" rx="7" ry="4" fill="#fff"/><circle cx="38" cy="38" r="3" fill="#eee3cf"/></symbol>
  <symbol id="i-alb" viewBox="0 0 60 60"><path d="M12 46C12 24 28 10 50 10c0 22-14 38-38 36z" fill="#2f8f3c"/><path d="M14 44C24 34 34 24 46 14" stroke="#1f6129" stroke-width="3" fill="none"/><path d="M20 36c4 0 8 1 11 4M28 28c4 0 8 1 10 4" stroke="#1f6129" stroke-width="2" fill="none"/></symbol>
  <symbol id="i-ana" viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="#f6c83e"/><circle cx="30" cy="30" r="22" fill="none" stroke="#c98a12" stroke-width="4"/><circle cx="30" cy="30" r="7" fill="#fff6d8"/><path d="M30 10v13M30 37v13M10 30h13M37 30h13M16 16l9 9M35 35l9 9M44 16l-9 9M25 35l-9 9" stroke="#e3a51f" stroke-width="2"/></symbol>
  <symbol id="i-ket" viewBox="0 0 60 60"><rect x="18" y="16" width="24" height="38" rx="9" fill="#c8281e"/><rect x="24" y="6" width="12" height="12" rx="3" fill="#f4f0ea"/><rect x="22" y="28" width="16" height="12" rx="3" fill="#fff"/><path d="M26 34h8" stroke="#c8281e" stroke-width="3"/></symbol>
  <symbol id="i-horno" viewBox="0 0 60 60"><path d="M6 50V30a24 24 0 0 1 48 0v20z" fill="#b2563a"/><path d="M18 50V38a12 12 0 0 1 24 0v12z" fill="#2a120b"/><path d="M24 50c0-5 3-6 6-11 3 5 6 6 6 11z" fill="#ff8a1f"/></symbol>
  <symbol id="i-pre" viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="#2f8f3c"/><text x="30" y="40" text-anchor="middle" font-family="Lilita One" font-size="30" fill="#fff">?</text></symbol>
</defs></svg>
<script>
{
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const qs = new URLSearchParams(location.search);
const SUC = Number(qs.get('s')) || 0; let MESA = Number(qs.get('m')) || null;
const vista = $('#vista'), hud = $('#hud');
const J = { nombre: '', token: null, preguntas: [], r1: [], r2: { buenos: 0, malos: 0 }, r3: [], pts: [0, 0, 0], t0: 0 };
let timers = []; const limpiar = () => { timers.forEach((t) => { clearInterval(t); clearTimeout(t); cancelAnimationFrame(t); }); timers = []; };
const total = () => J.pts.reduce((a, b) => a + b, 0);
const setHud = (r) => { hud.hidden = false; $('#hud-r').textContent = `Ronda ${r} de 3`; $('#hud-p').textContent = total(); };
const azar = () => Math.random();
const api = async (url, body) => {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'No se pudo conectar. Probá de nuevo.'); return d;
};
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* sin storage */ } };
const leer = (k) => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } };
const puntosHorno = (p) => (p > 104 ? 0 : Math.max(0, Math.round(100 - Math.abs(p - 92) * 4.5)));
let INFO = null;

async function arrancar() {
  if (!SUC) { vista.innerHTML = '<h2>Escaneá el QR de tu mesa</h2><p>Este juego se abre desde el código QR que está en cada mesa.</p>'; return; }
  try { INFO = await api(`/api/juego/info?s=${SUC}`); } catch (e) { vista.innerHTML = `<h2>Ups</h2><p>${esc(e.message)}</p>`; return; }
  $('#local').textContent = INFO.sucursal.nombre + (MESA ? ` · mesa ${MESA}` : '');
  if (!INFO.activo) { vista.innerHTML = '<h2>El juego está en pausa</h2><p>Volvé a escanear el QR más tarde. ¡Gracias!</p>'; return; }
  inicio();
}

function inicio() {
  limpiar(); hud.hidden = true; J.pts = [0, 0, 0]; J.r1 = []; J.r2 = { buenos: 0, malos: 0 }; J.r3 = [];
  vista.innerHTML = `${MESA ? `<span class="mesa">📍 Mesa ${MESA} · ${esc(INFO.sucursal.nombre)}</span>` : ''}<h2>¿Sos el mejor pizzaiolo de la noche?</h2>
    <p>3 rondas, menos de 2 minutos. Tu puntaje aparece en la pantalla del bar.</p>
    <div class="rondas">
      <div><svg><use href="#i-horno"/></svg><span><b>Al punto</b><small>Sacá la pizza del horno justo a tiempo</small></span></div>
      <div><svg><use href="#i-tom"/></svg><span><b>Armá la Margherita</b><small>Tocá tomate, mozzarella y albahaca. ¡Nada de ananá!</small></span></div>
      <div><svg><use href="#i-pre"/></svg><span><b>Trivia del bar</b><small>Pizzas, horno y tragos, contra reloj</small></span></div></div>
    ${INFO.premio ? `<div class="premio">🏆 ${esc(INFO.premio)}</div>` : ''}
    <div class="${MESA ? '' : 'fila'}"><div><label for="nom">Tu nombre</label><input id="nom" class="campo" maxlength="16" placeholder="Ej.: Caro" value="${esc(J.nombre || leer('pz_nombre'))}" autocomplete="given-name"></div>
      ${MESA ? '' : '<div><label for="mesa">Mesa</label><input id="mesa" class="campo" inputmode="numeric" maxlength="3" placeholder="N°"></div>'}</div>
    <div class="err" id="err"></div><button class="btn" id="go">¡A jugar!</button>`;
  $('#go').onclick = async () => {
    const n = $('#nom').value.trim(); if (n.length < 2) { $('#err').textContent = 'Poné tu nombre'; $('#nom').focus(); return; }
    if (!MESA && $('#mesa')) { const m = Number($('#mesa').value); if (m > 0) { MESA = m; $('#local').textContent = INFO.sucursal.nombre + ` · mesa ${MESA}`; } }
    $('#go').disabled = true; $('#err').textContent = '';
    try { const r = await api('/api/juego/iniciar', { s: SUC, mesa: MESA, nombre: n }); J.token = r.token; J.preguntas = r.preguntas; J.nombre = n; guardar('pz_nombre', n); J.t0 = Date.now(); ronda1(); }
    catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
  };
}

// ---------- Ronda 1: Al punto ----------
function hornoSVG() {
  return `<svg viewBox="0 0 340 300" preserveAspectRatio="xMidYMid slice">
    <defs><radialGradient id="fg" cx="50%" cy="90%" r="70%"><stop offset="0" stop-color="#ffd36b"/><stop offset=".45" stop-color="#ff8a1f"/><stop offset="1" stop-color="#7a1f0a" stop-opacity="0"/></radialGradient>
      <pattern id="lad" width="34" height="18" patternUnits="userSpaceOnUse"><rect width="34" height="18" fill="#b2563a"/><path d="M0 17.5h34M17 0v9M0 9h34M33.5 9v9" stroke="#7d3522" stroke-width="2"/></pattern></defs>
    <rect width="340" height="300" fill="url(#lad)"/><path d="M50 300V190a120 110 0 0 1 240 0v110z" fill="#1c0b06"/><ellipse cx="170" cy="300" rx="130" ry="120" fill="url(#fg)" opacity=".75"/>
    <g fill="#ffb13b">${[90, 125, 215, 250].map((x, i) => `<path d="M${x} 262c-10-18 2-30 8-48 6 18 18 30 8 48z" opacity="${0.7 - i * 0.1}"><animate attributeName="d" dur="${0.6 + i * 0.13}s" repeatCount="indefinite" values="M${x} 262c-10-18 2-30 8-48 6 18 18 30 8 48z;M${x} 262c-12-20 4-36 10-54 4 20 14 34 6 54z;M${x} 262c-10-18 2-30 8-48 6 18 18 30 8 48z"/></path>`).join('')}</g>
    <rect x="40" y="276" width="260" height="10" rx="3" fill="#3a2117"/>
    <g transform="translate(170 250)"><ellipse rx="70" ry="20" fill="#000" opacity=".35" cy="12"/><ellipse rx="66" ry="24" id="masa" fill="#f3dca8"/><ellipse rx="50" ry="17" cy="-2" fill="#d8301f"/>
      <ellipse rx="10" ry="4" cx="-20" cy="-4" fill="#fbf7ef"/><ellipse rx="9" ry="4" cx="16" cy="-6" fill="#fbf7ef"/><ellipse rx="8" ry="3" cx="4" cy="4" fill="#fbf7ef"/><path d="M-6-8c4-4 9-4 12 0-4 2-8 2-12 0z" fill="#2f8f3c"/>
      <g id="manchas" opacity="0" fill="#2b1308">${Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; return `<circle cx="${(Math.cos(a) * 58).toFixed(1)}" cy="${(Math.sin(a) * 20).toFixed(1)}" r="${2 + (i % 3)}"/>`; }).join('')}</g></g></svg>`;
}
function ronda1() {
  limpiar(); setHud(1); let n = 0;
  vista.innerHTML = `<h2>Al punto</h2><p>Cuando el borde tenga manchitas de leopardo (zona verde), tocá <b>¡Sacar!</b>. Si te pasás, se quema.</p>
    <div class="oven">${hornoSVG()}</div>
    <div><div class="calor"><i id="aguja" style="left:0"></i></div><div class="leyenda"><span>Cruda</span><span style="color:#2f8f3c">Al punto</span><span>Quemada</span></div></div>
    <div class="msg" id="msg">Pizza 1 de 3</div><button class="btn verde" id="sacar">¡Sacar!</button>`;
  const masa = $('#masa'), man = $('#manchas'), ag = $('#aguja'), msg = $('#msg'), btn = $('#sacar');
  const mezcla = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  const color = (p) => (p < 60 ? mezcla([243, 220, 168], [232, 168, 73], p / 60) : p < 100 ? mezcla([232, 168, 73], [168, 96, 34], (p - 60) / 40) : mezcla([168, 96, 34], [40, 18, 10], Math.min(1, (p - 100) / 12)));
  let p = 0, vel = 0, viva = false, t0 = 0;
  const una = () => {
    p = 0; vel = 38 + azar() * 26; viva = true; t0 = performance.now(); msg.textContent = `Pizza ${n + 1} de 3`; btn.disabled = false;
    const paso = (t) => { if (!viva) return; p = ((t - t0) / 1000) * vel; masa.setAttribute('fill', color(p)); man.setAttribute('opacity', Math.max(0, Math.min(1, (p - 70) / 22)));
      ag.style.left = `calc(${Math.min(100, p / 112 * 100)}% - 2px)`; if (p >= 112) return sacar(); timers.push(requestAnimationFrame(paso)); };
    timers.push(requestAnimationFrame(paso));
  };
  const sacar = () => {
    if (!viva) return; viva = false; btn.disabled = true;
    const v = Math.round(p * 10) / 10, s = puntosHorno(v); J.r1.push(v); J.pts[0] += s; setHud(1);
    msg.textContent = v > 104 ? '🔥 ¡Se quemó! 0 pts' : v < 70 ? `Cruda… +${s}` : s >= 85 ? `¡Perfecta, leopardato! +${s}` : `Bien +${s}`;
    n++; timers.push(setTimeout(() => (n < 3 ? una() : (msg.textContent = `Ronda 1: ${J.pts[0]} pts`, timers.push(setTimeout(ronda2, 1200)))), 1300));
  };
  btn.onclick = sacar; timers.push(setTimeout(una, 700));
}

// ---------- Ronda 2: Armá la Margherita ----------
const ING = [['i-tom', 'Tomate', 1], ['i-moz', 'Mozzarella', 1], ['i-alb', 'Albahaca', 1], ['i-ana', 'Ananá', 0], ['i-ket', 'Ketchup', 0]];
function ronda2() {
  limpiar(); setHud(2); const DUR = 15; let quedan = DUR;
  vista.innerHTML = `<h2>Armá la Margherita</h2><p>Tocá <b>tomate, mozzarella y albahaca</b> (+15). Ananá o ketchup: −20.</p>
    <div class="barra"><i id="tbar" style="width:100%"></i></div><div class="grid">${Array.from({ length: 9 }, (_, i) => `<button class="hole" aria-label="Vacío"><svg><use href=""/></svg></button>`).join('')}</div>
    <div class="msg" id="msg">${DUR} s</div>`;
  const holes = [...document.querySelectorAll('.hole')], est = holes.map(() => null);
  const mostrar = () => {
    const libres = est.map((e, i) => (e ? -1 : i)).filter((i) => i >= 0); if (!libres.length) return;
    const i = libres[Math.floor(azar() * libres.length)], k = azar() < 0.68 ? Math.floor(azar() * 3) : 3 + Math.floor(azar() * 2);
    est[i] = ING[k]; holes[i].querySelector('use').setAttribute('href', '#' + ING[k][0]); holes[i].classList.add('on'); holes[i].setAttribute('aria-label', ING[k][1]);
    timers.push(setTimeout(() => { if (est[i] === ING[k]) { est[i] = null; holes[i].classList.remove('on'); holes[i].setAttribute('aria-label', 'Vacío'); } }, 900 + azar() * 500));
  };
  holes.forEach((h, i) => (h.onclick = () => {
    const e = est[i]; if (!e || quedan <= 0) return; est[i] = null; h.classList.remove('on');
    const v = e[2] ? 15 : -20; if (e[2]) J.r2.buenos++; else J.r2.malos++;
    J.pts[1] = Math.max(0, J.r2.buenos * 15 - J.r2.malos * 20); setHud(2);
    const s = document.createElement('span'); s.className = 'pts'; s.style.color = v > 0 ? '#2f8f3c' : '#c8281e'; s.textContent = (v > 0 ? '+' : '') + v; h.appendChild(s); setTimeout(() => s.remove(), 700);
  }));
  timers.push(setInterval(mostrar, 520));
  timers.push(setInterval(() => { quedan -= 0.25; $('#tbar').style.width = Math.max(0, quedan / DUR) * 100 + '%'; $('#msg').textContent = `${Math.max(0, Math.ceil(quedan))} s`;
    if (quedan <= 0) { limpiar(); $('#msg').textContent = `Ronda 2: ${J.pts[1]} pts · ${J.r2.buenos} bien, ${J.r2.malos} mal`; holes.forEach((h) => (h.disabled = true)); setTimeout(ronda3, 1500); } }, 250));
}

// ---------- Ronda 3: Trivia (la corrige el servidor) ----------
function ronda3() {
  limpiar(); setHud(3); let k = 0;
  const una = () => {
    const q = J.preguntas[k]; let quedan = 10, resp = false; const t0 = performance.now();
    vista.innerHTML = `<h2>Trivia del bar</h2><p>Pregunta ${k + 1} de ${J.preguntas.length} · cuanto más rápido, más puntos</p><div class="barra"><i id="tbar" style="width:100%"></i></div>
      <div class="preg">${esc(q.texto)}</div><div class="ops">${q.opciones.map((o, i) => `<button class="op" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="msg" id="msg"></div>`;
    const btns = [...document.querySelectorAll('.op')];
    const cerrar = (i) => {
      if (resp) return; resp = true; limpiar(); btns.forEach((b) => (b.disabled = true));
      J.r3.push(i == null ? null : { op: i, ms: Math.round(performance.now() - t0) });
      if (i != null) btns[i].classList.add('elegida'); $('#msg').textContent = i == null ? '⏰ ¡Tiempo!' : '¡Respondido!';
      k++; timers.push(setTimeout(() => (k < J.preguntas.length ? una() : terminar()), 900));
    };
    btns.forEach((b, i) => (b.onclick = () => cerrar(i)));
    timers.push(setInterval(() => { quedan -= 0.1; $('#tbar').style.width = Math.max(0, quedan * 10) + '%'; if (quedan <= 0) cerrar(null); }, 100));
  };
  una();
}

// ---------- Resultado ----------
async function terminar() {
  limpiar(); hud.hidden = true;
  vista.innerHTML = '<div class="cargando">Sumando tus puntos…</div>';
  const espera = 31000 - (Date.now() - J.t0); if (espera > 0) await new Promise((r) => setTimeout(r, espera));
  let r;
  try { r = await api('/api/juego/terminar', { token: J.token, r1: J.r1, r2: J.r2, r3: J.r3 }); }
  catch (e) { vista.innerHTML = `<h2>Ups</h2><p>${esc(e.message)}</p><button class="btn" id="otra">Jugar otra vez</button>`; $('#otra').onclick = inicio; return; }
  let top = []; try { top = await api(`/api/juego/top?s=${SUC}`); } catch (_) { top = []; }
  const yoEn = top.findIndex((t) => t.nombre === J.nombre && t.puntos === r.puntos && (t.mesa || null) === (MESA || null));
  vista.innerHTML = `<h2>¡Listo, ${esc(J.nombre)}!</h2><div class="total">${r.puntos}</div>
    <div class="puesto">${r.puesto === 1 ? '🏆 ¡Vas primero en el ranking!' : `Vas ${r.puesto}° de ${r.de} esta noche`}</div>
    <div class="desg"><div><span>Al punto</span><b>${r.r1}</b></div><div><span>Armá la Margherita</span><b>${r.r2}</b></div><div><span>Trivia del bar (${r.correctas} de ${J.preguntas.length})</span><b>${r.r3}</b></div></div>
    ${top.length ? `<h2 style="font-size:22px;margin-top:6px">Ranking de la noche</h2><div class="top">${top.map((t, i) => `<div class="${i === yoEn ? 'yo' : ''}"><span class="n">${i + 1}</span><span>${esc(t.nombre)}${t.mesa ? `<small>mesa ${t.mesa}</small>` : ''}</span><span class="p">${t.puntos}</span></div>`).join('')}</div>` : ''}
    ${INFO.premio ? `<div class="premio">🏆 ${esc(INFO.premio)}</div>` : ''}
    <button class="btn" id="otra">Jugar otra vez</button>`;
  $('#otra').onclick = inicio;
}

arrancar();
}
</script>
</body>
</html>
